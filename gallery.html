<!DOCTYPE html>
<html lang="en">
    <head>

        <link rel="stylesheet" href="Tree.css">

    <body>
<!--Section 1: Header-->
        <header class="header">
            <span>

            <img src="images/footer.jpeg" class="footer-img">

            </div>
            <div class="social-links">
